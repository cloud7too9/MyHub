<!DOCTYPE html>
<html lang="de" data-theme="dunkel">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060709">
<title>Hefter · Register</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/01-ringe.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/png/01-ringe-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
/* Theme vor dem ersten Rendern setzen (kein Aufblitzen) */
try { document.documentElement.dataset.theme = localStorage.getItem("hefter:theme") || "dunkel"; } catch {}
</script>
</head>
<body>

<div class="appbar">
  <a class="marke" href="index.html">
    <img data-appicon src="icons/01-ringe.svg" alt="">
    Hefter
  </a>
  <span class="spacer"></span>
  <button class="iconbtn" data-themebtn aria-label="Design wechseln — aktuell Dunkel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    <span class="lbl">Dunkel</span>
  </button>
  <a class="iconbtn" href="einstellungen.html" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
  </a>
</div>

<div class="wrap">

  <header class="reg-kopf">
    <h1>Register</h1>
    <p>Alle Anleitungen deines Hefters — nach Bereich sortiert.</p>
  </header>

  <div class="suche">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="sucheFeld" type="search" placeholder="Anleitung suchen…" autocomplete="off">
    <kbd>Strg K</kbd>
  </div>

  <div id="registerListe"></div>
  <p class="leer" id="keineTreffer">Keine Anleitung gefunden.</p>

  <p class="foot">Neue Anleitung: Vorlage in <span class="mono">/anleitungen</span> kopieren, Titel/Chip/Meta-Tags anpassen, dann <span class="mono">node bauen.mjs</span> — Register und Service Worker aktualisieren sich selbst.</p>
</div>

<script src="hefter.js"></script>
</body>
</html>
